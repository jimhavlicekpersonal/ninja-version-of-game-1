# Alert rules for the Kagemura server (roadmap step 47), for Prometheus or
# Grafana Cloud (import as a rule file). The server serves these metrics at
# /metrics to METRICS_TOKEN (server/observability.ts, METRIC_HELP).
# Thresholds are starting points: tune them after a few weeks of real traffic.
groups:
  - name: kagemura-server
    rules:
      - alert: ServerDown
        expr: up{job="kagemura"} == 0
        for: 3m
        labels: { severity: page }
        annotations:
          summary: 'A Kagemura server instance is not answering /metrics.'

      - alert: HighErrorRate
        expr: |
          sum(rate(tk_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(tk_http_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels: { severity: page }
        annotations:
          summary: 'More than 2% of requests fail with a server error.'

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(tk_http_request_duration_ms_bucket[5m]))) > 1000
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: '95% of requests take longer than 1 s (re-simulation or the database).'

      - alert: EventLoopBlocked
        expr: max(tk_event_loop_delay_ms{quantile="0.99"}) > 250
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: 'The event loop is blocked for >250 ms at p99: battle re-simulation needs the worker pool (roadmap step 57) or more instances.'

      - alert: DatabasePoolSaturated
        expr: max(tk_db_pool_connections{state="waiting"}) > 0
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: 'Requests are waiting for a database connection.'

      - alert: RefundSpike
        expr: |
          sum(increase(tk_refunds_total[24h])) > 5
            and sum(increase(tk_refunds_total[24h])) / clamp_min(sum(increase(tk_purchases_total[24h])), 1) > 0.1
        labels: { severity: warn }
        annotations:
          summary: 'More than 10% of purchases were refunded in the last day (abuse, or a delivery bug).'

      - alert: DesyncsRising
        expr: |
          sum by (rules) (rate(tk_desyncs_total[30m])) / clamp_min(sum by (rules) (rate(tk_battles_total[30m])), 1e-9) > 0.01
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: 'More than 1% of battles under battle rules {{ $labels.rules }} desync between game and server (right after a release: data or rules shipped out of order?).'

      # Roadmap step 78: version trouble after a release.
      - alert: VersionMismatchReports
        expr: |
          sum(rate(tk_refused_reports_total{reason=~"rules_mismatch|data_mismatch|seed_mismatch|rules_retired"}[30m]))
            / clamp_min(sum(rate(tk_battles_total[30m])), 1e-9) > 0.02
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: 'More than 2% of battle reports are refused for a version mismatch (a release out of order, or a version retired too early).'

      - alert: UnknownDataVersions
        expr: sum by (rules) (rate(tk_unknown_data_total[1h])) > 0.05
        for: 1h
        labels: { severity: info }
        annotations:
          summary: 'Games on battle rules {{ $labels.rules }} send a data version this server does not know (a build with other numbers): expect desyncs.'

      - alert: OldRulesCanRetire
        expr: |
          sum by (rules) (rate(tk_client_requests_total[1d]))
            / ignoring(rules) group_left sum(rate(tk_client_requests_total[1d])) < 0.02
        for: 3d
        labels: { severity: info }
        annotations:
          summary: 'Battle rules {{ $labels.rules }} carry under 2% of traffic: they can be retired (docs/SHIPPING.md, "Release order").'

      - alert: RateLimitStorm
        expr: sum(rate(tk_rate_limited_total[5m])) > 5
        for: 10m
        labels: { severity: info }
        annotations:
          summary: 'Many requests are rate limited (abuse, or limits too tight for real traffic).'

      - alert: DeletionRequestsOverdue
        expr: max(tk_staff_queue{queue="deletion",state="overdue"}) > 0
        labels: { severity: page }
        annotations:
          summary: 'An account-deletion request is older than 30 days (the legal limit): handle it in /admin today.'

      - alert: DeletionRequestsWaiting
        expr: max(tk_staff_queue{queue="deletion",state="open"}) > 0
        for: 7d
        labels: { severity: warn }
        annotations:
          summary: 'Account-deletion requests have waited a week: handle them well before the 30-day limit.'

      - alert: ReportsOverdue
        expr: max(tk_staff_queue{queue="reports",state="overdue"}) > 0
        labels: { severity: warn }
        annotations:
          summary: 'A player report has waited more than 24 hours (the commitment to the stores): handle it in /admin.'
