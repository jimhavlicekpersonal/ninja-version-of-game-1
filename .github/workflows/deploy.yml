name: Test, build and deploy

# Every push runs the tests and a production build.
# Pushes to main also publish the game to GitHub Pages
# (repo Settings -> Pages -> Source must be "GitHub Actions").
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck:server
      - run: npm run build
        env:
          # Set this repository variable to your PvP server's URL to turn on online play.
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          # Store listings for "Update Kagemura" (roadmap step 75); set once the listings exist.
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL }}
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
          # Public key that checks balance bundles (roadmap step 76); without it bundles are never used.
          VITE_BALANCE_PUBLIC_KEY: ${{ vars.VITE_BALANCE_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPLE_SERVICES_ID: ${{ vars.VITE_APPLE_SERVICES_ID }}
      - name: Server first (roadmap step 74)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node tools/release/check-server-rules.mjs
        env:
          SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The multiplayer server on real Postgres: storage contract, server rules,
  # and the protocol contract against the production bundle.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tk_test
    steps:
      - uses: actions/checkout@v7
        with:
          # The previous release's client (latest v* tag) is checked out for its contract tests (step 77).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:server
      - run: npx vitest run tests/backend/server tests/backend/net tests/backend/contract
      - run: npm run server:build
      # The test suites above migrate only their own throwaway schemas, so the
      # database's default schema is still empty here. The built server refuses
      # to start with pending migrations (as in production), so run the same
      # release step a real deployment runs, against this disposable database.
      - name: Migrate the contract database (release step)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          npm run server:migrate
          npm run server:migrate -- --status
      - name: Start the built server and wait until it is ready
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          PORT: '8787'
        run: |
          nohup node dist-server/main.js > server.log 2>&1 &
          echo $! > server.pid
          # /readyz answers 200 only once the database answers; give it 60 s.
          for i in $(seq 1 60); do
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "::error::The contract server exited before it was ready. Its log:"
              cat server.log
              exit 1
            fi
            if curl -sf http://localhost:8787/readyz; then echo; echo "Server ready after ${i}s."; exit 0; fi
            sleep 1
          done
          echo "::error::The contract server was not ready (GET /readyz) within 60 s. Its log:"
          cat server.log
          curl -s http://localhost:8787/readyz || true
          exit 1
      - name: Protocol contract against the built server on Postgres
        run: |
          CONTRACT_URL=http://localhost:8787 npm run test:contract || (cat server.log; exit 1)
          # Step 77: the game players still have (the previous v* release) must keep working with this server.
          CONTRACT_URL=http://localhost:8787 node tools/release/previous-client-contract.mjs || (cat server.log; exit 1)
      - name: Server log
        if: always()
        run: cat server.log 2>/dev/null || true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the published game and language assets
        run: node tools/release/check-published-game.mjs
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
