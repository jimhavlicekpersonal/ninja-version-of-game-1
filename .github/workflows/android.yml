name: Android app (debug APK and signed release AAB)

# Two builds (see docs/SHIPPING.md, "Android", and docs/store/RELEASE.md):
# - apk: a debug APK to install by hand on a test phone (e.g. a Pixel 7). No
#   Play Billing (purchases need a Play-installed build). Same artifact as before.
# - aab: the Google Play release (audit GLOBAL-017): built with
#   VITE_PLAY_BILLING=1, an increasing versionCode, signed with the upload key.
#   Upload the AAB in Play Console (internal testing first).
#
# Owner setup for the release AAB (repository secrets):
#   ANDROID_KEYSTORE_BASE64    the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the upload key's alias
#   ANDROID_KEY_PASSWORD       the upload key's password
# Without all four the aab job says so and builds nothing (the debug APK still builds).
# Repository variables: ANDROID_VERSION_CODE_OFFSET (added to the run number so
# versionCode stays above any build already uploaded; default 0),
# VITE_PUBLIC_URL (the web game's address: friend links shared from the app),
# VITE_GOOGLE_CLIENT_ID (Sign in with Google: the server/web OAuth client id).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        # Beast Mode OPS-04: staging builds read VITE_SERVER_URL, VITE_SENTRY_DSN and the rest from the
        # "staging" GitHub environment (testers' builds talk to the staging server). Only a production build may
        # go to Play's production track (docs/store/RELEASE.md).
        description: 'Which server and crash-report environment the release AAB uses'
        type: choice
        options: [staging, production]
        default: staging

  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Server first (roadmap step 74)
        run: node tools/release/check-server-rules.mjs
        env:
          SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          # Friend links shared from the app open the web game (R09).
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          # Store listings for "Update Kagemura" (roadmap step 75); set once the listings exist.
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL }}
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
          # Public key that checks balance bundles (roadmap step 76); without it bundles are never used.
          VITE_BALANCE_PUBLIC_KEY: ${{ vars.VITE_BALANCE_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_DEPLOY_ENV: production
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPLE_SERVICES_ID: ${{ vars.VITE_APPLE_SERVICES_ID }}
          # P7-11 (PUB-14): local-day statistics; the owner's switch (repository variable VITE_STATS_TZ=1), off by default.
          VITE_STATS_TZ: ${{ vars.VITE_STATS_TZ || '0' }}
      # Beast Mode STB-10: what the first visit downloads stays within budget.
      - name: Bundle size budget
        run: node tools/perf/bundle-budget.mjs
      # Beast Mode OPS-02/STB-02: source maps go privately to Sentry (when configured) and never ship.
      - name: Source maps (private upload, then removed)
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            RELEASE="kagemura@$(node -p "require('./package.json').version")+${GITHUB_SHA::12}"
            npx --yes @sentry/cli@2.39.1 sourcemaps upload --release "$RELEASE" --dist android --url-prefix '~/assets' dist/assets
          else
            echo "::notice::No SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT: source maps not uploaded (crash reports stay minified)."
          fi
          find dist -name '*.map' -delete
          if find dist -name '*.map' | grep -q .; then echo "::error::source maps left in dist"; exit 1; fi
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kagemura-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  aab:
    runs-on: ubuntu-latest
    # Beast Mode OPS-04: vars.* read from this environment first (pushes to main build production).
    environment: ${{ github.event.inputs.target || 'production' }}
    env:
      DEPLOY_TARGET: ${{ github.event.inputs.target || 'production' }}
      APP_ID: ${{ vars.APP_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Upload key present?
        id: key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No signed Android release::The release AAB was not built: set the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (docs/SHIPPING.md, Android). The debug APK job is unaffected."
            echo "⚠️ **No signed Android release.** The release AAB was not built: the upload-key secrets are not set (docs/SHIPPING.md, Android). The debug APK job is unaffected." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # PUB-05 (P7-02): never upload under the old game's package name by accident (Play never lets it change).
      # PUB-04 (P7-01): a store build needs the publisher facts, dated terms and the app id; the preflight lists
      # everything still open and stops here on the blocking ones (docs/store/OWNER_CHECKLIST.md).
      - name: Store readiness
        if: steps.key.outputs.ready == 'true'
        run: node tools/release/check-store-ready.mjs --store --platform=android
        env:
          APP_ID: ${{ vars.APP_ID }}
          ALLOW_LEGACY_APP_ID: ${{ vars.ALLOW_LEGACY_APP_ID }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL }}
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: App id chosen
        if: steps.key.outputs.ready == 'true'
        run: node tools/release/check-app-id.mjs
        env:
          APP_ID: ${{ vars.APP_ID }}
          ALLOW_LEGACY_APP_ID: ${{ vars.ALLOW_LEGACY_APP_ID }}
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - if: steps.key.outputs.ready == 'true'
        run: npm ci
      # Beast Mode OPS-01: a save, rules, protocol or migration change needs a greater version.
      - if: steps.key.outputs.ready == 'true'
        run: node tools/release/check-version.mjs
      - name: Server first (roadmap step 74)
        if: steps.key.outputs.ready == 'true'
        run: node tools/release/check-server-rules.mjs
        env:
          SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      # Beast Mode STB-01: push needs the owner's Firebase file. Without it the game never registers for push on
      # Android (registering without Firebase crashes the app natively); with it, VITE_ANDROID_PUSH=1 turns push on.
      - name: Firebase configuration (push)
        id: firebase
        if: steps.key.outputs.ready == 'true'
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "push=1" >> "$GITHUB_OUTPUT"
          else
            echo "push=0" >> "$GITHUB_OUTPUT"
            echo "::notice::No GOOGLE_SERVICES_JSON secret: this Android build has no server push."
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: Build the game (commercial configuration)
        if: steps.key.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_ANDROID_PUSH: ${{ steps.firebase.outputs.push }}
          # Google Play Billing on (payments/select.ts); the server must check Google receipts.
          VITE_PLAY_BILLING: '1'
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL }}
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
          VITE_BALANCE_PUBLIC_KEY: ${{ vars.VITE_BALANCE_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_DEPLOY_ENV: ${{ env.DEPLOY_TARGET }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPLE_SERVICES_ID: ${{ vars.VITE_APPLE_SERVICES_ID }}
          # P7-11 (PUB-14): local-day statistics; the owner's switch (repository variable VITE_STATS_TZ=1), off by default.
          VITE_STATS_TZ: ${{ vars.VITE_STATS_TZ || '0' }}
      # Beast Mode OPS-02/STB-02: source maps go privately to Sentry (when configured) and never ship.
      - name: Source maps (private upload, then removed)
        if: steps.key.outputs.ready == 'true'
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            RELEASE="kagemura@$(node -p "require('./package.json').version")+${GITHUB_SHA::12}"
            npx --yes @sentry/cli@2.39.1 sourcemaps upload --release "$RELEASE" --dist android --url-prefix '~/assets' dist/assets
          else
            echo "::notice::No SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT: source maps not uploaded (crash reports stay minified)."
          fi
          find dist -name '*.map' -delete
          if find dist -name '*.map' | grep -q .; then echo "::error::source maps left in dist"; exit 1; fi
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - if: steps.key.outputs.ready == 'true'
        run: npx cap sync android
      - name: Install the upload key
        if: steps.key.outputs.ready == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Version
        if: steps.key.outputs.ready == 'true'
        env:
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || '0' }}
        run: |
          code=$(( ${{ github.run_number }} + OFFSET ))
          name=$(node -p "require('./package.json').version")
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "versionCode $code, versionName $name"
      - name: Check the release dependency graph (Play Billing 8+)
        if: steps.key.outputs.ready == 'true'
        working-directory: android
        run: |
          deps=$(./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath --no-daemon)
          echo "$deps" | grep -E 'billingclient|androidx.credentials|identity.googleid' | sort -u
          v=$(echo "$deps" | grep -oE 'com\.android\.billingclient:billing:[0-9][0-9.]*( -> [0-9][0-9.]*)?' | head -1 | grep -oE '[0-9][0-9.]*$')
          if [ -z "$v" ] || [ "${v%%.*}" -lt 8 ]; then
            echo "::error::The release resolves Play Billing '${v:-none}'; Google Play requires 8 or later."
            exit 1
          fi
          echo "Play Billing $v"
      - name: Build signed release AAB
        if: steps.key.outputs.ready == 'true'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Check the signature
        if: steps.key.outputs.ready == 'true'
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | tail -1
          jarsigner -verify "$aab" | grep -q 'jar verified' || { echo "::error::The AAB is not signed."; exit 1; }
          # Compare with Play Console -> Test and release -> App integrity -> Upload key certificate.
          keytool -printcert -jarfile "$aab" | grep -E 'Owner|SHA256:' | head -2
      - name: Native libraries (16 KB page size)
        if: steps.key.outputs.ready == 'true'
        run: |
          # Play requires 16 KB-aligned native code for apps targeting Android 15+. AGP 8.5.1+
          # aligns uncompressed .so files; this lists any that a dependency brings in.
          libs=$(unzip -Z1 android/app/build/outputs/bundle/release/app-release.aab | grep '\.so$' || true)
          if [ -z "$libs" ]; then
            echo "No native libraries in the bundle: nothing to align."
          else
            echo "$libs"
            echo "::warning::The bundle has native libraries: confirm 16 KB support in Play Console (App bundle explorer) or with zipalign -c -P 16 on an APK built from it."
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kagemura-android-release-aab-${{ env.DEPLOY_TARGET }}-${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
