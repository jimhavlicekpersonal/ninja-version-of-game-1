<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a36" />
    <meta name="description" content="Kagemura: Ninja Clans. Build a hidden mountain village, train warriors, and raid rival strongholds." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kagemura" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Kagemura: Ninja Clans</title>
    <style>
      /* Session-long notices (main.ts showBanner): above the map and HUD layer, under dialogs. */
      .tk-banner { position: fixed; z-index: 9; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); max-width: 520px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 12px; border-radius: 14px; background: #f7f0e1; color: #26303d; box-shadow: 0 6px 24px rgba(0, 0, 0, .35); font: 600 14px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .tk-banner span { flex: 1 1 220px; }
      .tk-banner button { min-height: 40px; padding: 6px 14px; border: 0; border-radius: 10px; background: #26303d; color: #f7f0e1; font: 700 14px system-ui, -apple-system, sans-serif; cursor: pointer; }
      #boot .err { margin: 16px; }
      #boot .err p { margin: 0 0 8px; }
      #boot .err .small { font-weight: 500; font-size: 13px; color: #5f6b78; word-break: break-word; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="battle-hud" hidden></div>
    <div id="boot">
      <div class="boot-card">
        <img class="boot-mark" src="./icons/icon-192.png" alt="" width="112" height="112" />
        <div class="boot-title">Kagemura</div>
        <div class="boot-sub">Ninja Clans</div>
        <div class="boot-status">Lighting the lanterns…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
